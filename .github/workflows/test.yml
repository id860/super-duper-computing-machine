name: Smoke checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server-v3.mjs
      - run: node --check src/http/api.mjs
      - run: node --check src/http/chunks.mjs
      - run: node --check src/core/model.mjs
      - run: node --test test/core-v3.test.mjs test/chunks.test.mjs
