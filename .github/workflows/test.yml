name: Smoke checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server-v3.mjs
      - run: node --check src/http/api.mjs
      - run: node --check src/http/chunks.mjs
      - run: node --check src/http/sse.mjs
      - run: node --check src/http/world-bootstrap.mjs
      - run: node --check src/core/model.mjs
      - run: node --check src/core/world-fixes.mjs
      - run: node --check scripts/export-postgres.mjs
      - run: node --check public/app/interaction-patch.js
      - run: node --check public/app/viewport-cache.js
      - run: node --check public/app/chunk-consistency.js
      - run: node --check public/app/chunk-prefetch.js
      - run: npm test
