name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate server modules
        run: |
          node --check server-v3.mjs
          node --check src/http/api.mjs
          node --check src/core/model.mjs
      - name: Verify v3 architecture contracts
        run: node --test test/core-v3.test.mjs

  docker:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pixelfront-worlds:ci
