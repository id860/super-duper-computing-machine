name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate server and scale modules
        run: |
          node --check server-v3.mjs
          node --check src/http/api.mjs
          node --check src/http/chunks.mjs
          node --check src/http/world-bootstrap.mjs
          node --check src/http/player-preferences.mjs
          node --check src/core/model.mjs
          node --check src/core/world-fixes.mjs
          node --check src/core/postgres-mirror.mjs
          node --check src/core/redis-runtime.mjs
          node --check scripts/export-postgres.mjs
          node --check public/app/interaction-patch.js
          node --check public/app/viewport-cache.js
          node --check public/app/experience-patch.js
      - name: Verify unit and live API contracts
        run: npm test
  docker:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pixelfront-worlds:ci
