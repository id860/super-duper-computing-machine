name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Start smoke server
        run: |
          PORT=3100 DATA_DIR=/tmp/pixelfront-ci ADMIN_NICK=ci-admin ADMIN_PASSWORD=ci-password-123 node server.mjs > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:3100/api/worlds && break; sleep 0.5; done
      - name: Stop smoke server
        if: always()
        run: kill $(cat /tmp/server.pid) 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pixelfront-worlds:ci
