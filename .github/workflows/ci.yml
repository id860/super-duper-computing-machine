name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate source syntax
        run: |
          find src public/app scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check server-v3.mjs
          node --check worker-v3.mjs
      - name: Core v3
        run: node --test test/core-v3.test.mjs
      - name: Chunk index
        run: node --test test/chunks.test.mjs
      - name: Chunk LRU
        run: node --test test/chunk-lru.test.mjs
      - name: Chunk queue
        run: node --test test/chunk-queue.test.mjs
      - name: Chunk consistency
        run: node --test test/chunk-consistency.test.mjs
      - name: Tile grid and minimap
        run: node --test test/tile-grid.test.mjs test/minimap-nav.test.mjs
      - name: World contracts
        run: node --test test/world-fixes.test.mjs test/world-bootstrap.test.mjs
      - name: SSE and API contracts
        run: node --test test/sse-replay.test.mjs test/api-chunks.test.mjs test/chat-cosmetics.test.mjs test/metrics.test.mjs
      - name: Storage and load contracts
        run: node --test test/export-postgres.test.mjs test/store-mirrors.test.mjs test/db-sections.test.mjs test/postgres-chunks.test.mjs test/load-chunks.test.mjs
  docker:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pixelfront-worlds:ci
