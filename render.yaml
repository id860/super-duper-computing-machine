services:
  - type: web
    name: pixelfront-worlds
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/worlds
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: ADMIN_NICK
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: pixelfront-data
      mountPath: /app/data
      sizeGB: 1
