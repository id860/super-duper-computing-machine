<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelFront Worlds</title><style>:root{color-scheme:dark;--bg:#141414;--s:#202020;--b:#3b3b39;--t:#f7f7f5;--m:#9b9a96;--a:#5e9fe8}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--t);font:14px system-ui}.top{height:60px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand{font-size:18px;font-weight:800}.brand i{display:inline-block;width:22px;height:22px;background:linear-gradient(135deg,#5e9fe8 50%,#72bc8f 50%);border-radius:6px;vertical-align:middle;margin-right:8px}.grid{height:calc(100vh - 60px);display:grid;grid-template-columns:230px 1fr 300px}.side,.chat{padding:14px;background:#191919}.side{border-right:1px solid var(--b)}.chat{border-left:1px solid var(--b);display:grid;grid-template-rows:auto 1fr auto}.world{width:100%;text-align:left;padding:11px;margin:4px 0;border:1px solid transparent;border-radius:8px;background:transparent;color:inherit}.world.on{background:#5e9fe817;border-color:#5e9fe850}.stage{display:grid;grid-template-rows:54px 1fr 28px;min-width:0}.tools{display:flex;gap:7px;align-items:center;padding:9px;border-bottom:1px solid var(--b);overflow:auto}.color{width:30px;height:30px;border-radius:7px;border:2px solid transparent;flex:none}.color.on{border-color:white}.wrap{overflow:auto;display:grid;place-items:center;background:radial-gradient(#ffffff10 1px,transparent 1px);background-size:18px 18px}canvas{image-rendering:pixelated;background:white;cursor:crosshair}.status{padding:6px 10px;color:var(--m);border-top:1px solid var(--b)}button,input{font:inherit}.btn{padding:9px 12px;border:1px solid var(--b);border-radius:8px;background:#292929;color:inherit}.primary{background:var(--a);color:#102235;font-weight:700}.messages{overflow:auto;padding:10px 0}.msg{margin:10px 0}.msg b{display:block}.msg span{color:#ddd}.form{display:flex;gap:7px}.form input{min-width:0;flex:1;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--s);color:inherit}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center}.modal.hide{display:none}.card{width:min(420px,92vw);padding:24px;border:1px solid var(--b);border-radius:12px;background:var(--s)}.card input{width:100%;margin:6px 0 12px;padding:11px;background:#171717;color:inherit;border:1px solid var(--b);border-radius:8px}.muted{color:var(--m)}@media(max-width:850px){.grid{grid-template-columns:70px 1fr}.side{padding:8px}.world{font-size:0}.world:before{content:'◆';font-size:18px}.chat{display:none}.brand span{display:none}}@media(max-width:520px){.top{height:56px}.grid{height:calc(100vh - 56px);grid-template-columns:1fr}.side{position:fixed;z-index:3;bottom:0;left:0;right:0;height:54px;display:flex;border-top:1px solid var(--b);border-right:0}.world{width:48px}.stage{padding-bottom:54px}.tools{padding:8px}.color{width:28px;height:28px}}</style></head><body><header class="top"><div class="brand"><i></i>PixelFront <span class="muted">Worlds</span></div><div><b id="title">Главный мир</b> · <span id="energy" class="muted">—</span></div><button id="account" class="btn primary">Войти</button></header><main class="grid"><aside class="side"><p class="muted">МИРЫ</p><div id="worlds"></div><button id="create" class="btn">＋ Мир</button><button id="rank" class="btn">🏆 Топ</button></aside><section class="stage"><div id="palette" class="tools"></div><div class="wrap"><canvas id="canvas"></canvas></div><div id="status" class="status">Рейтинг — только официальный мир</div></section><aside class="chat"><h3>Чат мира</h3><div id="messages" class="messages"></div><form id="chat" class="form"><input id="text" maxlength="400" placeholder="Сообщение…"><button class="btn primary">↑</button></form></aside></main><div id="modal" class="modal hide"><div class="card" id="card"></div></div><script>const $=s=>document.querySelector(s),api=async(p,o={})=>{let r=await fetch(p,{headers:{'content-type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error);return d},esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let S={user:null,worlds:[],world:null,pixels:{},color:'#202124',es:null};function popup(h){$('#card').innerHTML=h;$('#modal').classList.remove('hide')}$('#modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.add('hide')};async function init(){S.user=(await api('/api/me')).user;S.worlds=(await api('/api/worlds')).worlds;renderAccount();renderWorlds();open(location.hash.slice(1)||'official')}function renderAccount(){$('#account').textContent=S.user?S.user.nick:'Войти'}function renderWorlds(){$('#worlds').innerHTML=S.worlds.map(w=>`<button class="world ${S.world?.id===w.id?'on':''}" data-id="${w.id}">${esc(w.name)}<br><small class="muted">${w.type==='official'?'рейтинг':'сообщество'}</small></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id))}async function open(id){let d=await api('/api/worlds/'+id);S.world=d.world;S.pixels=d.pixels;location.hash=id;$('#title').textContent=S.world.name;$('#energy').textContent=d.energy?`⚡ ${d.energy.value}/${S.world.maxEnergy}`:'гость';$('#status').textContent=S.world.type==='official'?'Рейтинг и достижения включены':'Мир сообщества — без глобальных наград';$('#palette').innerHTML=S.world.palette.map(c=>`<button class="color ${c===S.color?'on':''}" style="background:${c}" data-c="${c}"></button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.color=b.dataset.c;open(id)});let c=$('#canvas');c.width=S.world.width;c.height=S.world.height;c.style.width=S.world.width*7+'px';c.style.height=S.world.height*7+'px';draw();renderWorlds();loadChat();S.es?.close();S.es=new EventSource('/api/events?world='+id);S.es.addEventListener('pixel',e=>{let p=JSON.parse(e.data);S.pixels[p.x+','+p.y]=p;draw()});S.es.addEventListener('chat',e=>message(JSON.parse(e.data)))}function draw(){let c=$('#canvas'),x=c.getContext('2d');x.fillStyle=S.world.palette[0];x.fillRect(0,0,c.width,c.height);Object.entries(S.pixels).forEach(([k,p])=>{let[a,b]=k.split(',');x.fillStyle=p.color;x.fillRect(+a,+b,1,1)})}$('#canvas').onclick=async e=>{if(!S.user)return login();let r=e.target.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*S.world.width),y=Math.floor((e.clientY-r.top)/r.height*S.world.height);try{let d=await api(`/api/worlds/${S.world.id}/pixel`,{method:'POST',body:JSON.stringify({x,y,color:S.color})});$('#energy').textContent=`⚡ ${d.energy.value}/${S.world.maxEnergy}`}catch(e){alert(e.message)}};async function loadChat(){let d=await api(`/api/worlds/${S.world.id}/chat`);$('#messages').innerHTML='';d.messages.forEach(message)}function message(m){if(document.querySelector('[data-msg="'+m.id+'"]'))return;let d=document.createElement('div');d.className='msg';d.dataset.msg=m.id;d.innerHTML=`<b>${esc(m.nick)}</b><span>${esc(m.text)}</span>`;$('#messages').append(d)}$('#chat').onsubmit=async e=>{e.preventDefault();if(!S.user)return login();let t=$('#text').value.trim();if(!t)return;$('#text').value='';try{await api(`/api/worlds/${S.world.id}/chat`,{method:'POST',body:JSON.stringify({text:t})})}catch(e){alert(e.message)}};function login(reg=false){popup(`<h2>${reg?'Регистрация':'Вход'}</h2><form id="auth"><input name="nick" placeholder="Ник" required><input name="password" type="password" placeholder="Пароль (от 8 символов)" required><button class="btn primary">${reg?'Создать':'Войти'}</button> <button type="button" id="switch" class="btn">${reg?'Уже есть аккаунт':'Регистрация'}</button></form>`);$('#switch').onclick=()=>login(!reg);$('#auth').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/auth/'+(reg?'register':'login'),{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});S.user=d.user;renderAccount();$('#modal').classList.add('hide');open(S.world.id)}catch(e){alert(e.message)}}}$('#account').onclick=()=>S.user?popup(`<h2>${esc(S.user.nick)}</h2><p>${S.user.officialPixels} официальных пикселей · уровень ${S.user.level}</p><button id="logout" class="btn">Выйти</button>`):login();document.addEventListener('click',e=>{if(e.target.id==='logout')api('/api/auth/logout',{method:'POST'}).then(()=>location.reload())});$('#create').onclick=()=>{if(!S.user)return login();popup(`<h2>Новый мир</h2><form id="wf"><input name="name" value="Мой мир"><input name="width" type="number" value="96"><input name="height" type="number" value="64"><input name="cooldownMs" type="number" value="1000"><button class="btn primary">Создать</button></form>`);$('#wf').onsubmit=async e=>{e.preventDefault();let d=await api('/api/worlds',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});S.worlds.push(d.world);$('#modal').classList.add('hide');open(d.world.id)}};$('#rank').onclick=async()=>{let d=await api('/api/leaderboard');popup('<h2>Официальный топ</h2>'+d.users.map((u,i)=>`<p>${i+1}. <b>${esc(u.nick)}</b> — ${u.officialPixels}</p>`).join(''))};init().catch(e=>alert(e.message));</script></body></html>
